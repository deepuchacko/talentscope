[project]
name = "talentscope"
version = "0.1.0"
description = "AI-powered hiring recommendation tool"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.0",
    "pypdf>=4.0",
    "python-docx>=1.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
talentscope = "talentscope.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talentscope"]
